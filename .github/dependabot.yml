version: 2
updates:
  # npm
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'
  # github-actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
  # Docker 基础镜像
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7

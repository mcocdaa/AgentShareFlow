services:
  server:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: agentshareflow-server:2.0.0
    ports:
      - "${AGENTSHARE_BIND:-127.0.0.1}:${AGENTSHARE_PORT:-8787}:8787"
    environment:
      - AGENTSHARE_ENABLE_RELAY=${AGENTSHARE_ENABLE_RELAY:-false}
      - AGENTSHARE_STUN_URLS=${AGENTSHARE_STUN_URLS:-stun:stun.l.google.com:19302}
      - AGENTSHARE_ADMIN_USER
      - AGENTSHARE_ADMIN_PASS
      - AGENTSHARE_BOOTSTRAP_INVITE
      - AGENTSHARE_DATA=/data
      - AGENTSHARE_MAX_AGENT_HOPS=${AGENTSHARE_MAX_AGENT_HOPS:-5}
    volumes:
      - agentshare-data:/data
    restart: unless-stopped

volumes:
  agentshare-data:
